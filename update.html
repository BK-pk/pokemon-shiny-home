<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHINY HOME 更新 v77</title>
<style>body{font-family:system-ui;background:#07111d;color:#eef7ff;display:grid;place-items:center;min-height:100vh;margin:0}
div{max-width:520px;padding:24px;text-align:center}button{font-size:18px;padding:14px 22px;border:0;border-radius:12px;background:#2388d8;color:white;font-weight:800}</style>
<div><h1>SHINY HOME 更新 v77</h1><p id="msg">古いキャッシュを削除します。</p><button id="go">更新する</button></div>
<script>
document.getElementById('go').onclick=async()=>{
  const m=document.getElementById('msg');m.textContent='更新中…';
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const ks=await caches.keys();
      await Promise.all(ks.map(k=>caches.delete(k)));
    }
    m.textContent='更新完了。アプリを開きます。';
    location.replace('./?fresh='+Date.now());
  }catch(e){m.textContent='更新に失敗しました: '+e.message}
};
</script>
