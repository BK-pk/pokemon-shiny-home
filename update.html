<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shiny HOME 更新 v130</title><style>body{font-family:system-ui;background:#07111d;color:#eef7ff;display:grid;place-items:center;min-height:100vh;margin:0}div{max-width:640px;padding:24px;text-align:center}button{font-size:18px;padding:14px 22px;border:0;border-radius:12px;background:#2388d8;color:white;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.sub{font-size:13px;color:#9bb2c7;line-height:1.7}</style><div><h1>Shiny HOME 更新 v130</h1><p id="msg">更新前データを安全領域へバックアップしてから更新します。</p><p class="sub">今回は localStorage にコピーを作らず、更新前バックアップを IndexedDB に保存します。現在のコレクション・個体・画像・厳選・BINGOデータは削除しません。v130では個体画面の画像操作を整理し、殿堂入りとSHINY GET画像を廃止しました。画像作成は「個体画像を作成」1つにまとめています。</p><button id="go">更新する</button></div><script>
const HISTORY_KEY='shinyHomePreUpdateHistory_v1';
const DB_NAME='shinyHomeSafeBackups_v1',STORE='backups';
const DATA_KEYS=['shinyHomeState_v1','shinyHomeBoxes_v1','shinyHomeDates_v1','shinyHomeGames_v1','shinyHomeIndividuals_v1','shinyHomeTargets_v1','shinyHomeHunts_v1','shinyHomeNationalBox_v1','shinyHomeOrder_v1','shinyHomeActiveTab_v1','shinyHomeMobileFocusedHunt_v1','shinyHomeMonthImages_v1','shinyHomeBingo_v1','shinyHomeIndividualScreenshots_v1'];
function collect(){const values={};for(const k of DATA_KEYS){const v=localStorage.getItem(k);if(v!==null)values[k]=v}return values}
function ownedCount(values){try{return Object.values(JSON.parse(values.shinyHomeState_v1||'{}')).filter(Boolean).length}catch(e){return 0}}
function individualCount(values){try{return Object.values(JSON.parse(values.shinyHomeIndividuals_v1||'{}')).reduce((n,a)=>n+(Array.isArray(a)?a.length:0),0)}catch(e){return 0}}
function individualFingerprint(values){try{const o=JSON.parse(values.shinyHomeIndividuals_v1||'{}')||{},rows=Object.values(o).flatMap(a=>Array.isArray(a)?a:[]).filter(x=>x&&typeof x==='object'),fields=['date','game','ball','huntMethod','source','huntStart'],filled={};for(const f of fields)filled[f]=rows.filter(x=>String(x[f]??'').trim()!=='').length;filled.huntCount=rows.filter(x=>Number(x.huntCount)>0).length;return {individualCount:rows.length,filled}}catch(e){return {individualCount:0,filled:{}}}}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('IndexedDBを開けません'))})}
async function putBackup(entry){const db=await openDB();try{await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(entry);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('バックアップ保存に失敗'))})}finally{db.close()}}
function saveHistoryMeta(entry){let arr=[];try{arr=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');if(!Array.isArray(arr))arr=[]}catch(e){arr=[]}const meta={id:entry.id,createdAt:entry.createdAt,sourceVersion:entry.sourceVersion,targetVersion:entry.targetVersion,storage:'indexeddb',partial:false,ownedCount:entry.ownedCount,individualCount:entry.individualCount};arr=[meta,...arr.filter(x=>x.id!==meta.id)].slice(0,10);localStorage.setItem(HISTORY_KEY,JSON.stringify(arr))}
async function prune(){const db=await openDB();try{await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite'),st=tx.objectStore(STORE),r=st.getAll();r.onsuccess=()=>{const a=(r.result||[]).sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));a.slice(10).forEach(x=>st.delete(x.id))};tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}finally{db.close()}}
document.getElementById('go').onclick=async()=>{const btn=document.getElementById('go'),m=document.getElementById('msg');btn.disabled=true;m.textContent='v130更新直前バックアップを安全領域へ作成中…';try{const values=collect(),createdAt=new Date().toISOString(),entry={id:'preupdate-'+Date.now(),schema:3,createdAt,sourceVersion:'pre-v130',targetVersion:'v130',partial:false,values,ownedCount:ownedCount(values),individualCount:individualCount(values)};try{localStorage.setItem('shinyHomePendingUpgradeCheck_v1',JSON.stringify({targetVersion:'v130',createdAt,fingerprint:individualFingerprint(values)}))}catch(_){}await putBackup(entry);try{saveHistoryMeta(entry)}catch(metaErr){console.warn('履歴メタデータは容量不足のため保存を省略しました',metaErr)}await prune();m.textContent=`バックアップ完了（所持 ${entry.ownedCount} / 個体 ${entry.individualCount}）。更新中…`;if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(x=>x.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}m.textContent='更新完了。v130を開きます。';location.replace('./?fresh='+Date.now())}catch(e){m.textContent='バックアップを作成できなかったため更新を中止しました。現在のデータは変更していません。 '+(e&&e.message?e.message:'');btn.disabled=false}};
</script></html>
