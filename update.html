<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shiny HOME 更新 v98</title><style>body{font-family:system-ui;background:#07111d;color:#eef7ff;display:grid;place-items:center;min-height:100vh;margin:0}div{max-width:520px;padding:24px;text-align:center}button{font-size:18px;padding:14px 22px;border:0;border-radius:12px;background:#2388d8;color:white;font-weight:800}</style><div><h1>Shiny HOME 更新 v98</h1><p id="msg">古いキャッシュを削除してv98へ更新します。</p><button id="go">更新する</button></div><script>(function(){try{const map={state:'shinyHomeState_v1',boxState:'shinyHomeBoxes_v1',dateState:'shinyHomeDates_v1',gameState:'shinyHomeGames_v1',individualState:'shinyHomeIndividuals_v1',targetState:'shinyHomeTargets_v1',huntState:'shinyHomeHunts_v1',monthImages:'shinyHomeMonthImages_v1',individualScreenshots:'shinyHomeIndividualScreenshots_v1'};const data={};for(const [n,k] of Object.entries(map)){try{data[n]=JSON.parse(localStorage.getItem(k)||'{}')}catch{data[n]={}}}const count=Object.values(data.individualState||{}).reduce((n,a)=>n+(Array.isArray(a)?a.length:0),0),K='shinyHomeBackupHistory_v98',arr=JSON.parse(localStorage.getItem(K)||'[]');arr.unshift({at:new Date().toISOString(),label:'v97更新直前',count,data});localStorage.setItem(K,JSON.stringify(arr.slice(0,20)));document.getElementById('msg').textContent='v97のデータをバックアップしました。更新できます。'}catch(e){console.warn(e)}})();</script><script>document.getElementById('go').onclick=async()=>{const m=document.getElementById('msg');m.textContent='更新中…';try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}m.textContent='更新完了。アプリを開きます。';location.replace('./?fresh='+Date.now())}catch(e){m.textContent='更新に失敗しました: '+e.message}};</script></html>
