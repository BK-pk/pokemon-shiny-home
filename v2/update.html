<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHINY HOME COLLECTION 2 v159</title>
<style>
body{margin:0;background:#07131d;color:#eef7ff;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}.card{width:min(680px,90vw);background:#0d2230;border:1px solid #24485e;border-radius:20px;padding:28px;box-shadow:0 20px 70px #0008}h1{margin-top:0}button,a{display:inline-block;background:#1c7696;color:white;border:0;border-radius:12px;padding:13px 18px;font-weight:800;text-decoration:none;cursor:pointer}.sub{color:#9db3c3;line-height:1.7}.ok{color:#8fe6b0}
</style>
<div class="card">
  <h1>SHINY HOME COLLECTION 2 v159</h1>
  <p class="sub">更新後に捕獲スクリーンショットが消えて見える問題を修正しました。保存済み画像を専用の画像保存領域から再表示します。</p>
  <p class="sub">この更新はコレクション・画像・バックアップを削除しません。BW2 SHINY JOURNEYにも触れません。</p>
  <p id="status" class="ok">準備完了</p>
  <button onclick="clean()">古いキャッシュだけ解除して開く</button>
  <a href="./index.html">そのまま開く</a>
</div>
<script>
async function clean(){
  const s=document.getElementById('status');
  try{
    if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}
    if('caches'in window){for(const k of await caches.keys())if(k.startsWith('shiny-home-')||k.startsWith('shinyHome'))await caches.delete(k)}
    s.textContent='キャッシュ解除完了。データと画像は変更していません。';
    setTimeout(()=>location.href='./index.html?fresh='+Date.now(),500);
  }catch(e){s.textContent='解除できない項目がありましたが、データと画像は変更していません。'}
}
</script>
</html>
