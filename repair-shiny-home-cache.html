<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHINY HOME キャッシュ修復</title><style>body{font-family:system-ui,sans-serif;background:#071627;color:#eaf6ff;max-width:720px;margin:40px auto;padding:20px}button{font-size:18px;padding:14px 20px;border-radius:12px;border:1px solid #4ca7d8;background:#12324b;color:white}pre{white-space:pre-wrap;background:#0c1f31;padding:14px;border-radius:12px}</style><h1>SHINY HOME キャッシュ修復</h1><p>この処理は <b>localStorage / IndexedDB のコレクションデータや画像を削除しません。</b><br>Service Worker と Cache Storage だけを削除します。</p><button id="go">修復する</button><pre id="log">待機中</pre><script>
const log=s=>document.getElementById('log').textContent += '\n'+s;
document.getElementById('go').onclick=async()=>{
 document.getElementById('log').textContent='開始';
 try{
   if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs){await r.unregister();log('Service Worker解除: '+(r.scope||''));}}
   if('caches' in window){const ks=await caches.keys();for(const k of ks){if(k.startsWith('shiny-home-')){await caches.delete(k);log('Cache削除: '+k)}}}
   log('完了。localStorage / IndexedDB は変更していません。');
   log('このタブを閉じ、index.html を Ctrl+Shift+R で開き直してください。');
 }catch(e){log('エラー: '+e)}
};
</script></html>
