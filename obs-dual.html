<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHINY HOME OBS Switch + 3DS</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:"Consolas","Yu Gothic UI",monospace}*{box-sizing:border-box}
#stage{position:relative;width:1920px;height:1080px;transform-origin:top left}#frame{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none}.pixel{image-rendering:pixelated;image-rendering:crisp-edges}
.counter{position:absolute;height:112px;color:#07111d;display:grid;grid-template-columns:118px 1fr 178px;align-items:center;padding:0 22px;background:#fcfcfa}
#switchCounter{left:220px;top:765px;width:610px}#dsCounter{left:910px;top:765px;width:585px}
.counter .poke{width:88px;height:88px;object-fit:contain;justify-self:center}.meta{display:grid;grid-template-columns:88px 1fr;gap:8px 10px;align-items:center;min-width:0}.meta .k{font-size:20px;font-weight:950;letter-spacing:.06em}.meta .v{font-size:23px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.count{text-align:right;font-size:66px;font-weight:950;line-height:1;white-space:nowrap}.count small{font-size:26px;margin-left:4px}
.infoBlock{position:absolute;left:1690px;width:190px;color:#fff;display:grid;align-content:center;gap:5px}.infoBlock .row{display:grid;grid-template-columns:78px 1fr;gap:6px;align-items:center;min-height:32px}.infoBlock .k{font-size:16px;font-weight:900;color:#cfe8f4;white-space:nowrap}.infoBlock .v{font-size:18px;font-weight:950;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#switchInfo{top:236px;height:176px}#dsInfo{top:457px;height:142px}
.dexNum{position:absolute;left:1680px;width:190px;color:#ffd54f;font-size:64px;font-weight:950;text-align:center;line-height:1;text-shadow:2px 2px 0 #07111d}.dexNum small{font-size:28px;color:#fff;margin-left:5px}#national{top:670px}#bw2{top:815px}
#status{position:absolute;right:28px;bottom:18px;color:#fff;font-size:14px;text-shadow:2px 2px #000;opacity:.7}
.debug .hole{position:absolute;border:3px dashed #ffdf54;background:rgba(255,223,84,.12)}.debug #swHole{left:118px;top:167px;width:782px;height:517px}.debug #uHole{left:1092px;top:170px;width:353px;height:228px}.debug #lHole{left:1113px;top:465px;width:299px;height:210px}
</style></head><body><div id="stage">
<img id="frame" src="./obs-frame-dual.png" alt="">
<div class="counter" id="switchCounter"><img class="poke pixel" id="switchSprite" alt=""><div class="meta"><span class="k">GAME</span><span class="v" id="switchGame">—</span><span class="k">METHOD</span><span class="v" id="switchMethod">—</span></div><div class="count"><span id="switchCount">0</span><small>回</small></div></div>
<div class="counter" id="dsCounter"><img class="poke pixel" id="dsSprite" alt=""><div class="meta"><span class="k">GAME</span><span class="v" id="dsGame">—</span><span class="k">METHOD</span><span class="v" id="dsMethod">—</span></div><div class="count"><span id="dsCount">0</span><small>回</small></div></div>
<div class="infoBlock" id="switchInfo"></div><div class="infoBlock" id="dsInfo"></div>
<div class="dexNum" id="national">--<small>匹</small></div><div class="dexNum" id="bw2">--<small>匹</small></div>
<div id="status"></div><div class="hole" id="swHole"></div><div class="hole" id="uHole"></div><div class="hole" id="lHole"></div>
</div>
<script>
const SUPABASE_URL='https://litkisamojglstbjwloo.supabase.co',SUPABASE_KEY='sb_publishable_pc-8E8ETM6yZ3OcB1cNkjA_OzVjc-Rh',USER_ID='pokemon-shiny-home',COUNTER_TABLE='shiny_home_hunt_counters',OBS_TABLE='shiny_home_obs_state';
const params=new URLSearchParams(location.search);if(params.get('debug')==='1')document.body.classList.add('debug');const fixedSwitch=params.get('switchId')||'',fixedDs=params.get('dsId')||'';const SWITCH_GAMES=new Set(['Let’s Go','剣盾','BDSP','Pokémon LEGENDS アルセウス','SV']),DS_GAMES=new Set(['DP/Pt','HGSS','BW','BW2','XY','ORAS','SM','USUM']);const $=id=>document.getElementById(id);function headers(){return{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}}function fit(){const sc=Math.min(innerWidth/1920,innerHeight/1080);$('stage').style.transform=`scale(${sc})`;$('stage').style.left=((innerWidth-1920*sc)/2)+'px';$('stage').style.top=((innerHeight-1080*sc)/2)+'px'}addEventListener('resize',fit);fit();
function noFromId(id){const m=String(id||'').match(/^0*(\d+)/);return m?Number(m[1]):0}function spriteUrl(no){return no?`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/shiny/${no}.png`:''}
function fmtOdds(n){return!isFinite(n)||n<=0?'—':'1 / '+Math.round(n).toLocaleString('ja-JP')}function oddsFromRolls(r,b=4096){const p=1-Math.pow((b-1)/b,r);return 1/p}
function recordMode(m){return({'野生遭遇':'遭遇回数','固定リセット':'リセット回数','ソフトリセット':'リセット回数','国際孵化':'孵化数','SOS連鎖':'呼出回数','ポケトレ':'連鎖数','大量発生（SV）':'時間','サンドウィッチ厳選':'時間','大量発生＋サンドウィッチ':'時間','ダイマックスアドベンチャー':'周回数','その他':'回数'})[m]||'回数'}
function shinyOdds(game,method,charm,hunt={},count=0){const c=charm==='あり',g4=['DP/Pt','HGSS'].includes(game),g67=['XY','ORAS','SM','USUM'].includes(game);if(method==='SOS連鎖'&&['SM','USUM'].includes(game)){let r=count>=31?13:count>=21?9:count>=11?5:1;if(c)r+=2;return{rate:fmtOdds(oddsFromRolls(r)),note:`連鎖 ${count}回`}}if(game==='SV'&&['大量発生','大量発生（SV）','サンドウィッチ厳選','大量発生＋サンドウィッチ'].includes(method)){const isOut=['大量発生','大量発生（SV）','大量発生＋サンドウィッチ'].includes(method),cleared=isOut?String(hunt.outbreak||'0'):'0',sp=Number(hunt.sparkling)||0;let rolls=1+(c?2:0)+Math.max(0,Math.min(3,sp));if(isOut&&cleared==='30')rolls+=1;if(isOut&&cleared==='60')rolls+=2;const parts=[];if(isOut)parts.push(cleared==='60'?'大量発生60+':cleared==='30'?'大量発生30+':'大量発生0+');if(sp)parts.push(`かがやきLv${sp}`);return{rate:fmtOdds(oddsFromRolls(rolls)),note:parts.join(' / ')||'通常遭遇'}}if(method==='ダイマックスアドベンチャー')return{rate:c?'1 / 100':'1 / 300',note:'1匹ごと'};if(method==='国際孵化'){if(g4)return{rate:'約1 / 1,639',note:'国際孵化'};if(game==='BW')return{rate:'約1 / 1,366',note:'国際孵化'};if(game==='BW2')return{rate:c?'1 / 1,024':'約1 / 1,366',note:'国際孵化'};if(g67||['剣盾','SV','BDSP'].includes(game))return{rate:c?'1 / 512':'約1 / 683',note:'国際孵化'}}if(['野生遭遇','固定リセット','ソフトリセット','ひかるおまもり厳選','その他',''].includes(method)){if(g4||game==='BW')return{rate:'1 / 8,192',note:'通常確率'};if(game==='BW2')return{rate:c?'約1 / 2,731':'1 / 8,192',note:c?'おまもり有効':'通常確率'};if(g67||game==='剣盾'||game==='SV')return{rate:c?'約1 / 1,366':'1 / 4,096',note:c?'おまもり有効':'通常確率'};if(game==='BDSP')return{rate:'1 / 4,096',note:'固定/野生'};if(game==='Let’s Go')return{rate:c?'約1 / 1,366':'1 / 4,096',note:'通常遭遇'}}return{rate:'—',note:'追加条件あり'}}
function huntRows(row){if(!row)return[['基本確率','—'],['おまもり','—'],['記録','—'],['条件','—']];const h=row.hunt||{},cnt=Number(row.count)||0,o=shinyOdds(h.game||'',h.method||'',h.charm||'',h,cnt),rows=[['基本確率',o.rate],['おまもり',h.charm||'未設定']];if(h.game==='SV'&&['大量発生','大量発生（SV）','大量発生＋サンドウィッチ'].includes(h.method||'')){const ob=String(h.outbreak||'0');rows.push(['大量発生',ob==='60'?'60匹以上':ob==='30'?'30～59匹':'0～29匹']);rows.push(['かがやき',Number(h.sparkling)?`Lv${Number(h.sparkling)}`:'なし']);}else{rows.push(['記録',recordMode(h.method||'')]);rows.push(['条件',o.note||'—']);}return rows}
function renderInfo(id,row){$(id).innerHTML=huntRows(row).map(([k,v])=>`<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}
function pick(rows,kind,fixed,state){if(fixed){const r=rows.find(x=>x.pokemon_id===fixed);if(r)return r}const stateId=kind==='switch'?state.switch_pokemon_id:state.ds_pokemon_id;if(stateId){const r=rows.find(x=>x.pokemon_id===stateId);if(r)return r}const set=kind==='switch'?SWITCH_GAMES:DS_GAMES;return rows.filter(r=>set.has(String(r.hunt?.game||''))).sort((a,b)=>Date.parse(b.updated_at||0)-Date.parse(a.updated_at||0))[0]||null}
function show(prefix,row){if(!row){$(prefix+'Game').textContent='—';$(prefix+'Method').textContent='—';$(prefix+'Count').textContent='0';$(prefix+'Sprite').removeAttribute('src');return}const h=row.hunt||{};$(prefix+'Game').textContent=h.game||'未設定';$(prefix+'Method').textContent=h.method||'未設定';$(prefix+'Count').textContent=Number(row.count)||0;const no=noFromId(row.pokemon_id),im=$(prefix+'Sprite');if(no){im.src=spriteUrl(no);im.onerror=()=>im.removeAttribute('src')}else im.removeAttribute('src')}
async function refresh(){try{const q=`${SUPABASE_URL}/rest/v1/${COUNTER_TABLE}?user_id=eq.${encodeURIComponent(USER_ID)}&active=eq.true&select=pokemon_id,count,active,hunt,updated_at`,s=`${SUPABASE_URL}/rest/v1/${OBS_TABLE}?user_id=eq.${encodeURIComponent(USER_ID)}&select=*&limit=1`;const[a,b]=await Promise.all([fetch(q,{headers:headers(),cache:'no-store'}),fetch(s,{headers:headers(),cache:'no-store'})]);if(!a.ok)throw new Error('counter '+a.status);const rows=await a.json(),state=b.ok?((await b.json())[0]||{}):{};const enabled=state.obs_enabled!==false,sw=enabled?pick(rows,'switch',fixedSwitch,state):null,ds=enabled?pick(rows,'ds',fixedDs,state):null;show('switch',sw);show('ds',ds);renderInfo('switchInfo',sw);renderInfo('dsInfo',ds);$('national').innerHTML=`${state.national_remaining??'--'}<small>匹</small>`;$('bw2').innerHTML=`${state.bw2_remaining??'--'}<small>匹</small>`;$('status').textContent=enabled?'● LIVE / SWITCH + 3DS':'● STREAM MODE OFF'}catch(e){$('status').textContent='● WAITING'}}refresh();setInterval(refresh,1000);
</script></body></html>
