<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHINY HOME OBS 3DS</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:"Consolas","Yu Gothic UI",monospace}*{box-sizing:border-box}
#stage{position:relative;width:1920px;height:1080px;transform-origin:top left}#frame{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none}.pixel{image-rendering:pixelated;image-rendering:crisp-edges}
#huntVals{position:absolute;left:1510px;top:265px;width:332px;height:255px;color:#fff;display:grid;grid-template-rows:repeat(4,1fr);align-items:center;padding:0 18px 0 8px;font-weight:950}
#huntVals>div{font-size:28px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bw2{position:absolute;left:1280px;top:625px;width:560px;height:145px;color:#fff;display:flex;align-items:center;justify-content:center;gap:20px;font-weight:950}#bw2 .k{font-size:34px}#bw2 .n{font-size:76px;color:#ffd54f}#bw2 .u{font-size:30px}
#counter{position:absolute;left:390px;top:866px;width:986px;height:136px;color:#07111d;display:grid;grid-template-columns:125px 1fr 230px;align-items:center;padding:0 24px}
#sprite{width:98px;height:98px;object-fit:contain;justify-self:center}.meta{display:grid;grid-template-columns:120px 1fr;gap:10px 14px;align-items:center;font-size:27px;font-weight:900;min-width:0}.meta .k{font-size:22px}.meta .v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.count{text-align:right;font-size:78px;font-weight:950;white-space:nowrap}.count small{font-size:30px;margin-left:7px}
#status{position:absolute;right:28px;bottom:20px;color:#fff;font-size:14px;text-shadow:2px 2px #000;opacity:.7}.debug .hole{position:absolute;border:3px dashed #ffdf54;background:rgba(255,223,84,.13)}.debug #u{left:330px;top:162px;width:780px;height:331px}.debug #l{left:485px;top:558px;width:491px;height:229px}
</style></head><body><div id="stage"><img id="frame" src="./obs-frame-3ds.png" alt=""><div id="huntVals"><div id="odds">—</div><div id="charm">—</div><div id="record">—</div><div id="condition">—</div></div><div id="bw2"><span class="k">あと</span><span class="n" id="bw2Remaining">--</span><span class="u">匹</span></div><div id="counter"><img id="sprite" class="pixel" alt=""><div class="meta"><span class="k">GAME</span><span class="v" id="game">—</span><span class="k">METHOD</span><span class="v" id="method">—</span></div><div class="count"><span id="count">0</span><small>回</small></div></div><div id="status"></div><div class="hole" id="u"></div><div class="hole" id="l"></div></div>
<script>
const SUPABASE_URL='https://litkisamojglstbjwloo.supabase.co',SUPABASE_KEY='sb_publishable_pc-8E8ETM6yZ3OcB1cNkjA_OzVjc-Rh',USER_ID='pokemon-shiny-home',COUNTER_TABLE='shiny_home_hunt_counters',OBS_TABLE='shiny_home_obs_state';
const params=new URLSearchParams(location.search);if(params.get('debug')==='1')document.body.classList.add('debug');const fixedDs=params.get('dsId')||'';const DS_GAMES=new Set(['DP/Pt','HGSS','BW','BW2','XY','ORAS','SM','USUM']);const $=id=>document.getElementById(id);function headers(){return{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}}function fit(){const sc=Math.min(innerWidth/1920,innerHeight/1080);$('stage').style.transform=`scale(${sc})`;$('stage').style.left=((innerWidth-1920*sc)/2)+'px';$('stage').style.top=((innerHeight-1080*sc)/2)+'px'}addEventListener('resize',fit);fit();
function noFromId(id){const m=String(id||'').match(/^0*(\d+)/);return m?Number(m[1]):0}function spriteUrl(no){return no?`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/shiny/${no}.png`:''}
function recordMode(m){return({'野生遭遇':'遭遇回数','固定リセット':'リセット回数','ソフトリセット':'リセット回数','国際孵化':'孵化数','SOS連鎖':'呼び出し回数','ポケトレ':'連鎖数','連鎖':'連鎖数','その他':'回数'})[m]||'回数'}
function fmtOdds(n){return!isFinite(n)||n<=0?'—':'1 / '+Math.round(n).toLocaleString('ja-JP')}function oddsFromRolls(r,b=4096){const p=1-Math.pow((b-1)/b,r);return 1/p}
function shinyOdds(game,method,charm,count){const c=charm==='あり',g4=['DP/Pt','HGSS'].includes(game),g67=['XY','ORAS','SM','USUM'].includes(game);if(method==='SOS連鎖'&&['SM','USUM'].includes(game)){let r=count>=31?13:count>=21?9:count>=11?5:1;if(c)r+=2;return[fmtOdds(oddsFromRolls(r)),`連鎖 ${count}回`]}if(method==='国際孵化'){if(g4)return['約1 / 1,639','国際孵化'];if(game==='BW')return['約1 / 1,366','国際孵化'];if(game==='BW2')return[c?'1 / 1,024':'約1 / 1,366','国際孵化'];if(g67)return[c?'1 / 512':'約1 / 683','国際孵化']}if(['野生遭遇','固定リセット','ソフトリセット','その他',''].includes(method)){if(g4||game==='BW')return['1 / 8,192','通常確率'];if(game==='BW2')return[c?'約1 / 2,731':'1 / 8,192',c?'おまもり有効':'通常確率'];if(g67)return[c?'約1 / 1,366':'1 / 4,096',c?'おまもり有効':'通常確率']}if(method==='ポケトレ')return['—','連鎖数で変動'];return['—','追加条件あり']}
function pick(rows,state){const id=fixedDs||state.ds_pokemon_id||'';if(id){const r=rows.find(x=>x.pokemon_id===id);if(r)return r}return rows.filter(r=>DS_GAMES.has(String(r.hunt?.game||''))).sort((a,b)=>Date.parse(b.updated_at||0)-Date.parse(a.updated_at||0))[0]||null}
function show(row){if(!row){for(const id of['game','method','odds','charm','record','condition'])$(id).textContent='—';$('count').textContent='0';$('sprite').removeAttribute('src');return}const h=row.hunt||{},cnt=Number(row.count)||0;$('game').textContent=h.game||'未設定';$('method').textContent=h.method||'未設定';$('count').textContent=cnt;$('charm').textContent=h.charm||'未設定';$('record').textContent=recordMode(h.method||'');const o=shinyOdds(h.game||'',h.method||'',h.charm||'',cnt);$('odds').textContent=o[0];$('condition').textContent=o[1];const no=noFromId(row.pokemon_id),im=$('sprite');if(no){im.src=spriteUrl(no);im.onerror=()=>im.removeAttribute('src')}else im.removeAttribute('src')}
async function refresh(){try{const q=`${SUPABASE_URL}/rest/v1/${COUNTER_TABLE}?user_id=eq.${encodeURIComponent(USER_ID)}&active=eq.true&select=pokemon_id,count,active,hunt,updated_at`,s=`${SUPABASE_URL}/rest/v1/${OBS_TABLE}?user_id=eq.${encodeURIComponent(USER_ID)}&select=*&limit=1`;const[a,b]=await Promise.all([fetch(q,{headers:headers(),cache:'no-store'}),fetch(s,{headers:headers(),cache:'no-store'})]);if(!a.ok)throw new Error('counter '+a.status);const rows=await a.json(),state=b.ok?((await b.json())[0]||{}):{};$('bw2Remaining').textContent=state.bw2_remaining??'--';show(state.obs_enabled===false?null:pick(rows,state));$('status').textContent=state.obs_enabled===false?'STREAM MODE OFF':'● LIVE / 3DS ONLY'}catch(e){$('status').textContent='● WAITING'}}refresh();setInterval(refresh,1000);
</script></body></html>
